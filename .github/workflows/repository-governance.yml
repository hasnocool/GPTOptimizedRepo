name: Repository Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile governance checker
        run: python -m py_compile scripts/check_repository_governance.py

      - name: Run repository governance checker
        run: python scripts/check_repository_governance.py
